# Re-runs the whole study from the seeds on each system and compares it with the saved files.
# Start it by hand from the Actions tab; it also runs when a release is published.
name: Full reproduction

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  reproduce:
    name: Full study on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - run: python -m pip install -r requirements.txt
      - run: python src/reproduce_all.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: outputs-${{ matrix.os }}
          path: outputs/
